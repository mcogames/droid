<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a1120" />
  <meta name="description" content="Droid Tycoon: consulte os seis caminhos, acompanhe seus droids e descubra o que guardar ou vender." />
  <title>Droid Tycoon — Guia de Progressão</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">✦</div><div><b>DROID<span>TYCOON</span></b><small>GUIA DE PROGRESSÃO</small></div></div>
      <div class="menu-label">NAVEGAÇÃO</div>
      <nav class="nav-items" id="side-nav" aria-label="Navegação principal">
        <button type="button" data-tab="dashboard" class="nav-item"><span class="nav-symbol">◫</span><span>Meu caminho</span></button>
        <button type="button" data-tab="search" class="nav-item"><span class="nav-symbol">⌕</span><span>Consultar droids</span></button>
        <button type="button" data-tab="inventory" class="nav-item"><span class="nav-symbol">▣</span><span>Meus droids</span></button>
        <button type="button" data-tab="settings" class="nav-item"><span class="nav-symbol">⚙</span><span>Configurações</span></button>
      </nav>
      <div class="side-spacer"></div>
      <div class="side-note"><span class="pulsedot"></span> Dados salvos neste navegador<small>Sem login · Backup disponível</small></div>
      <div class="source-label">BASE DO JOGO <b>V1.34.0</b></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="mobile-logo"><span class="brand-icon mini">✦</span><b>DROID<span>TYCOON</span></b></div><div class="topbar-left" id="top-breadcrumb">Guia de progressão</div><div class="topbar-right"><span class="online-pill"><i></i> Local</span><button class="icon-btn" type="button" title="Configurações e backup" data-tab="settings" aria-label="Configurações">⚙</button></div></header>
      <main id="app" class="main-content" aria-live="polite"><div class="loading">Carregando base de droids...</div></main>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Navegação móvel">
    <button type="button" data-tab="dashboard"><span>◫</span>Meu caminho</button>
    <button type="button" data-tab="search"><span>⌕</span>Consulta</button>
    <button type="button" data-tab="inventory"><span>▣</span>Inventário</button>
    <button type="button" data-tab="settings"><span>⚙</span>Ajustes</button>
  </nav>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="backup-file" accept=".json,application/json" hidden />
  <script src="data.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
